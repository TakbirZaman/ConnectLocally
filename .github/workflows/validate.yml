name: Validate LocalConnect
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libxcb1-dev libxkbcommon-dev libdbus-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-pipewire gstreamer1.0-plugins-good xvfb xauth
      - run: rustup toolchain install 1.88.0 --component clippy,rustfmt
      - run: flutter pub get --enforce-lockfile
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Permission-denied write and recovery (unprivileged runner)
        run: cargo test --locked --manifest-path rust/Cargo.toml --lib -- --ignored --exact transfer::tests::permission_denied_write_preserves_resume_state
      - name: Disk-full recovery on isolated disposable tmpfs
        shell: bash
        run: |
          volume="$(mktemp -d)"
          cleanup() { sudo umount "$volume"; rmdir "$volume"; }
          sudo mount -t tmpfs -o size=16m,mode=1777 tmpfs "$volume"
          trap cleanup EXIT
          touch "$volume/.localconnect-disposable-volume"
          LOCALCONNECT_FAILURE_VOLUME="$volume" cargo test --locked --manifest-path rust/Cargo.toml --lib disk_full_does_not_verify_chunk_and_recovers -- --ignored --exact transfer::tests::disk_full_does_not_verify_chunk_and_recovers
      - run: python3 tests/run_x11.py
      - name: Large file and RSS acceptance (manual workflow only)
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --locked --manifest-path rust/Cargo.toml --config 'profile.test.package.sha2.opt-level=3' --test large_transfer -- --ignored --nocapture
      - run: cargo build --locked --manifest-path rust/Cargo.toml --lib
      - run: flutter analyze
      - run: flutter test --dart-define=LOCALCONNECT_NATIVE_LIB=${{ github.workspace }}/rust/target/debug/liblocalconnect_core.so
      - run: flutter build linux --release
      - run: python3 -m unittest discover -s tests -p 'test_package_checksum.py'
      - run: python3 scripts/package.py --linux
      - run: python3 scripts/package_checksum.py dist/LocalConnect-Linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/LocalConnect-Linux-x64.tar.gz*
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          cache: true
      - run: rustup toolchain install 1.88.0 --component clippy,rustfmt
      - run: flutter pub get --enforce-lockfile
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - run: python -m unittest discover -s tests -p 'test_package_checksum.py'
      - run: python scripts/package.py --windows
      - run: python scripts/package_checksum.py dist/LocalConnect-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/LocalConnect-Windows-x64.zip*
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          cache: true
      - run: rustup toolchain install 1.88.0
      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 platforms;android-34 build-tools;35.0.0 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1'
      - run: python3 scripts/install_android.py
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Verify APK ABI, ELF alignment, signature and ZIP alignment
        shell: bash
        run: |
          python3 scripts/verify_android_apk.py build/app/outputs/flutter-apk/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 build/app/outputs/flutter-apk/app-debug.apk
      - run: python3 scripts/package_checksum.py build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk*

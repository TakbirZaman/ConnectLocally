name: Release safety
on:
  push:
    branches: [main]
    paths: ['scripts/package.py', 'scripts/verify_release_apk.py', 'tests/test_release_safety.py', '.github/workflows/release-safety.yml']
  pull_request:
    paths: ['scripts/package.py', 'scripts/verify_release_apk.py', 'tests/test_release_safety.py', '.github/workflows/release-safety.yml']
permissions:
  contents: read
jobs:
  safety:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_release_safety.py -v

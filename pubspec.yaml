name: localconnect
description: LAN-only secure file transfer and consent-based remote sessions
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_rust_bridge: 2.11.1
  file_picker: 10.1.2
  path_provider: 2.1.5
  ffi: 2.1.4
  localconnect_core:
    path: rust_builder
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
